name: 01 - CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            database: users
            port: 8001

          - service: student-service
            database: students
            port: 8002

          - service: lecturer-service
            database: lecturers
            port: 8003

          - service: course-service
            database: courses
            port: 8004

          - service: enrollment-service
            database: enrollments
            port: 8005

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: backend/${{ matrix.service }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ matrix.database }}
        run: |
          pytest -v


  # =========================================================
  # Build and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build and Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs:
      - backend-test

    # Pull requests perform testing only.
    # Images are built/pushed after merge/push to main
    # or when this workflow is manually triggered.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: koalatech-frontend
            context: ./frontend

          - image: koalatech-user-service
            context: ./backend/user-service

          - image: koalatech-student-service
            context: ./backend/student-service

          - image: koalatech-lecturer-service
            context: ./backend/lecturer-service

          - image: koalatech-course-service
            context: ./backend/course-service

          - image: koalatech-enrollment-service
            context: ./backend/enrollment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Direct ACR authentication
      # This avoids Azure service-principal login because the
      # Deakin CloudLabs account cannot reset Entra credentials.
      # -------------------------------------------------------
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }} \
            ${{ matrix.context }}

      - name: Push Docker image with commit SHA
        run: |
          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}