name: 03 - Test Staging

on:
  workflow_run:
    workflows:
      - "02 - Deploy to Staging"
    types:
      - completed
    branches:
      - main

jobs:
  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    steps:
      # =====================================================
      # Configure Kubernetes directly using stored kubeconfig
      # =====================================================
      - name: Configure Kubernetes
        shell: bash
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify AKS connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # =====================================================
      # Wait for the staging frontend LoadBalancer
      # =====================================================
      - name: Wait for staging frontend IP
        run: |
          for i in {1..30}; do

            FRONTEND_IP=$(kubectl get service frontend \
              -n staging \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              echo "Frontend IP found."
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Waiting for staging frontend IP..."
            sleep 10
          done

          echo "Unable to find staging frontend IP."
          exit 1

      # =====================================================
      # Smoke test
      # =====================================================
      - name: Test frontend
        run: |
          echo "Testing staging frontend..."

          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            http://${{ env.FRONTEND_IP }}

          echo ""
          echo "Staging smoke test passed."